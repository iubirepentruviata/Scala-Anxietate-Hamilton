<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Scala de evaluare a anxietății Hamilton</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#172b3a;background:#f3f6f8;font-size:18px;line-height:1.55}*{box-sizing:border-box}body{margin:0}.wrap{max-width:850px;margin:0 auto;padding:24px 20px 56px}.top{display:flex;justify-content:center;align-items:center;gap:12px}.lang{font:inherit;padding:10px 14px;border:1px solid #718392;border-radius:10px;background:white;color:#172b3a}header{padding:22px 0 12px}h1{font-size:clamp(1.8rem,4vw,2.5rem);line-height:1.15;margin:0 0 12px;color:#102c43}p{margin:.6em 0}.intro,.card,.result{background:#fff;border:1px solid #d8e1e7;border-radius:18px;padding:24px;box-shadow:0 5px 18px #17364a0b}.intro{margin:14px 0 20px}.note{font-size:.92rem;color:#405664}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}.result-actions{display:grid;gap:14px;margin-top:22px}.result-actions-secondary{display:flex;gap:14px;flex-wrap:wrap}.result-actions-secondary>*{flex:1 1 220px}button,.button-link{font:inherit;font-weight:650;border:0;border-radius:12px;padding:13px 20px;min-height:52px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.primary{background:#145b78;color:white}.secondary{background:#e8eff3;color:#17384b}.answer{width:100%;text-align:left;background:white;border:2px solid #cbd8df;color:#183345;margin:8px 0;padding:15px 18px;min-height:60px}.answer:hover,.answer:focus-visible{border-color:#145b78}.answer.selected{background:#e7f4f8;border-color:#145b78}.answer .num{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:50%;background:#edf2f4;margin-right:12px;font-weight:750}.progressline{height:12px;background:#dce6eb;border-radius:20px;overflow:hidden;margin:12px 0 6px}.bar{height:100%;background:#177390;transition:width .2s ease}.question-meta{font-weight:700;color:#38596b}.item{font-size:1.22rem;line-height:1.5;margin:16px 0 20px}.hidden{display:none!important}.score{font-size:2rem;font-weight:750;color:#145b78}.result h2{margin-top:0}.footer{margin-top:20px;color:#405664;font-size:.9rem}button:focus-visible,select:focus-visible,.button-link:focus-visible{outline:3px solid #e39b20;outline-offset:3px}.subtle{font-size:.85rem;color:#536875}@media(max-width:560px){.wrap{padding:14px 14px 40px}.intro,.card,.result{padding:19px;border-radius:14px}.item{font-size:1.12rem}.actions button,.actions .button-link,.result-actions-secondary>*{flex:1 1 100%}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body><main class="wrap">
<div class="top"><label class="subtle" for="language" id="language-label">Limba / Language</label><select class="lang" id="language" aria-labelledby="language-label"><option value="ro">Română</option><option value="en">English</option></select></div>
<header><h1 id="title"></h1><p class="note" id="subtitle"></p></header>
<section class="intro" id="intro"><p id="instructions"></p><p class="note" id="scale-note"></p><div class="actions"><button class="primary" id="start"></button></div></section>
<section class="card hidden" id="quiz" aria-labelledby="item-text"><div class="question-meta" id="counter"></div><div class="progressline" role="progressbar" id="progress" aria-valuemin="0" aria-valuemax="14" aria-valuenow="0"><div class="bar" id="bar"></div></div><p class="subtle" id="progress-text"></p><h2 class="item" id="item-text" tabindex="-1"></h2><div id="answers" role="group" aria-labelledby="item-text"></div><div class="actions"><button class="secondary" id="back"></button></div></section>
<section class="result hidden" id="result" tabindex="-1"><h2 id="result-title"></h2><p id="result-copy"></p><p><strong id="total-label"></strong>: <span id="total" class="score"></span> / 56</p><p><strong id="psychic-label"></strong>: <span id="psychic"></span> / 28</p><p><strong id="somatic-label"></strong>: <span id="somatic"></span> / 28</p><p><strong id="score-label"></strong>: <span id="score" class="score"></span> / 4</p><p><strong id="conclusion-label"></strong>: <strong id="conclusion"></strong></p><p class="subtle" id="result-note"></p><div class="result-actions"><a class="button-link primary" id="share" target="_blank" rel="noopener noreferrer"></a><div class="result-actions-secondary"><button class="secondary" id="edit"></button><button class="secondary" id="restart"></button></div></div><p class="subtle" id="share-note"></p></section>
<p class="footer" id="footer"></p></main>
<script>
const items=[
['Griji, anticiparea unor supărări, presimțiri înspăimântătoare, iritabilitate.','Worries, anticipating upsetting events, frightening forebodings, irritability.'],
['Sentimente de tensiune, fatigabilitate, răspuns speriat, tendința de a lăcrima ușor, tremurat, sentimente de neliniște, imposibilitate de a se relaxa.','Feelings of tension, easy fatigability, startle response, tendency to cry easily, trembling, feelings of restlessness, inability to relax.'],
['Frica de întuneric, de necunoscuți, de a fi părăsit singur, de animale, de trafic, de mulțime.','Fear of the dark, strangers, being left alone, animals, traffic, crowds.'],
['Dificultăți la adormire, somn întrerupt, somn nesatisfăcător, oboseală la trezire, vise, coșmaruri, teroare nocturnă.','Difficulty falling asleep, interrupted sleep, unsatisfying sleep, tiredness on waking, dreams, nightmares, night terrors.'],
['Dificultăți de concentrare, memorie săracă.','Difficulty concentrating, poor memory.'],
['Lipsa de interes, lipsa de plăcere în ceea ce constituia hobby-ul, tristețe, trezire devreme, oscilații diurne ale dispoziției.','Loss of interest, loss of pleasure in former hobbies, sadness, early waking, daily mood fluctuations.'],
['Dureri somatice, musculare, ticuri nervoase, crispări, tresăriri musculare, clănțănitul dinților, voce nesigură, creșterea tonusului muscular.','Somatic and muscle pain, nervous tics, twitching, muscle jerks, teeth chattering, unsteady voice, increased muscle tone.'],
['Senzația de înțepenire, încețoșarea vederii, valuri de cald și de frig, senzații de slăbiciune, înțepături.','Sensation of stiffness, blurred vision, hot and cold flashes, feelings of weakness, pins and needles.'],
['Tahicardie, palpitații, dureri în piept, perceperea vibrației vaselor, senzații de leșin, impresia de oprire a inimii.','Rapid heartbeat, palpitations, chest pain, awareness of blood vessel pulsation, faintness, feeling that the heart is stopping.'],
['Presiune sau constricție în piept, senzații de înecare/înăbușire, oftaturi și dispnee.','Pressure or tightness in the chest, choking or smothering sensations, sighing and shortness of breath.'],
['Dificultăți de deglutiție, meteorism, dureri abdominale, arsuri, balonare abdominală, greață, vărsături, borborisme, absența tranzitului, constipație sau diaree, pierderea în greutate.','Difficulty swallowing, abdominal gas, abdominal pain, heartburn, bloating, nausea, vomiting, rumbling bowel sounds, absent bowel movements, constipation or diarrhea, weight loss.'],
['Creșterea frecvenței micțiunilor, senzație de necesitate imperioasă de a urina, amenoree, metroragie, dezvoltare de frigiditate sau impotență, ejaculare precoce, absența libidoului.','Increased urinary frequency, urgent need to urinate, amenorrhea, uterine bleeding, development of frigidity or impotence, premature ejaculation, absence of libido.'],
['Gura uscată, înroșire bruscă, paloare, tendința la transpirație, zăpăceală, tensiune, cefalee, „piele de găină”.','Dry mouth, flushing, pallor, tendency to sweat, dizziness, tension, headache, goosebumps.'],
['Neastâmpăr, agitație, neliniște sau placiditate, tremur al mâinilor, frunte încrețită, față încordată, respirație rapidă, paloare facială, deglutiție în gol, râgâituri, contracturi ale tendoanelor, pupile dilatate, exoftalmie.','Fidgeting, agitation, restlessness or placidity, trembling hands, furrowed brow, tense face, rapid breathing, facial pallor, empty swallowing, belching, tendon contractions, dilated pupils, protruding eyes.']
];
const T={ro:{title:'Scala de evaluare a anxietății Hamilton',subtitle:'Autoevaluare orientativă, inspirată de scala Hamilton',instructions:'Pentru fiecare dintre cei 14 itemi, alegeți cota care descrie cel mai bine nivelul simptomului evaluat. Aceasta este o autoevaluare orientativă; în scala originală, itemul 14 este evaluat de clinician pe baza comportamentului observat la interviu. Selectarea unui răspuns vă duce automat la itemul următor. Puteți reveni oricând și schimba răspunsul.',scale:'Cote: 0 — absență · 1 — ușoară · 2 — moderată · 3 — severă · 4 — foarte severă / gravă. Sursa nu precizează o perioadă de referință.',start:'Începe evaluarea',question:'Întrebarea',progress:'răspunsuri completate',back:'Înapoi la itemul anterior',selected:'Selectat',result:'Rezultatul evaluării',copy:'Ați completat toți cei 14 itemi.',total:'Scor total',mean:'Media (scor total ÷ 14)',of:'/ 4',psychic:'Anxietate psihică (itemii 1–6 și 14)',somatic:'Anxietate somatică (itemii 7–13)',conclusion:'Notă de interpretare conform PDF',profile:'Distribuția răspunsurilor',explanation:'Scor total = suma cotelor celor 14 itemi (0–56). Media păstrează și formula din materialul furnizat: scor total ÷ 14 (0–4). Subscorurile psihic și somatic sunt sumele itemilor indicați.',caution:'PDF-ul spune doar că scorurile totale peste 20 au fost observate la persoane diagnosticate cu tulburări de anxietate de intensitate clinică în populația anglofonă. Nu prezintă praguri de categorie pentru scorurile sub 21 și nu stabilește un diagnostic. Scala din PDF se cotează într-un interviu semi-structurat de un evaluator instruit; pagina aceasta nu reproduce administrarea clinică.',source:'Scorare conform PDF: total 0–56; psihic itemii 1–6 și 14; somatic itemii 7–13.',share:'Trimite pe WhatsApp',shareNote:'WhatsApp se va deschide cu scorul total, subscorurile, media și interpretarea precompletate pentru numărul indicat. Nu se trimite automat: poți verifica sau modifica mesajul și trebuie să apeși Trimite în WhatsApp.',edit:'Revizuiește răspunsurile',restart:'Reîncepe',footer:'Nu sunt solicitate și nu sunt stocate date personale. Răspunsurile rămân doar în această pagină deschisă.',opts:['Absență','Ușoară','Moderată','Severă','Foarte severă / gravă'],below20:'PDF-ul nu atribuie o categorie acestui scor. ',above20:'Scor peste 20; PDF-ul menționează această valoare doar pentru populația anglofonă cu diagnostic clinic. '},en:{title:'Hamilton Anxiety Rating Scale',subtitle:'Indicative self-assessment adapted from the Hamilton scale',instructions:'For each of the 14 items, choose the rating that best describes the level of the symptom being assessed. This is an indicative self-assessment; in the original scale, item 14 is rated by a clinician from behavior observed during the interview. Selecting an answer moves you automatically to the next item. You can return at any time and change an answer.',scale:'Ratings: 0 — absent · 1 — mild · 2 — moderate · 3 — severe · 4 — very severe / grave. The source does not specify a reference period.',start:'Start assessment',question:'Question',progress:'answers completed',back:'Back to previous item',selected:'Selected',result:'Assessment result',copy:'You have completed all 14 items.',total:'Total score',mean:'Mean (total score ÷ 14)',of:'/ 4',psychic:'Psychic anxiety (items 1–6 and 14)',somatic:'Somatic anxiety (items 7–13)',conclusion:'Interpretation note from PDF',profile:'Response distribution',explanation:'Total score = sum of all 14 item ratings (0–56). The mean also follows the supplied material: total score ÷ 14 (0–4). Psychic and somatic subscores are the sums of the indicated items.',caution:'The PDF only states that total scores above 20 were observed in people diagnosed with clinically intense anxiety disorders in English-speaking populations. It gives no category cutoffs for scores below 21 and does not establish a diagnosis. The PDF scale is rated in a semi-structured interview by a trained evaluator; this page does not reproduce clinical administration.',source:'PDF scoring: total 0–56; psychic items 1–6 and 14; somatic items 7–13.',share:'Send via WhatsApp',shareNote:'WhatsApp will open with the total score, subscores, mean and interpretation prefilled for the specified number. Nothing is sent automatically: you can review or edit the message and must press Send in WhatsApp.',edit:'Review answers',restart:'Start again',footer:'No personal data is requested or stored. Answers remain only in this open page.',opts:['Absent','Mild','Moderate','Severe','Very severe / grave'],below20:'The PDF does not assign a category to this score. ',above20:'Score above 20; the PDF mentions this only for English-speaking populations with a clinical diagnosis. '}};
let lang='ro',answers=Array(14).fill(null),idx=0;const $=id=>document.getElementById(id);
function renderText(){const t=T[lang];document.documentElement.lang=lang;document.title=t.title;for(const [id,value] of Object.entries({title:t.title,subtitle:lang==='ro'?'Autoevaluare orientativă, inspirată de scala Hamilton':'Indicative self-assessment adapted from the Hamilton scale',instructions:t.instructions,'scale-note':lang==='ro'?'Cote 0–4. PDF-ul descrie un interviu semi-structurat cu grilă specifică fiecărui item; pagina aceasta este o adaptare auto-completată.':'Ratings 0–4. The PDF describes a semi-structured interview with item-specific rubrics; this page is a self-completed adaptation.',start:t.start,back:t.back,'result-title':t.result,'result-copy':t.copy,'total-label':lang==='ro'?'Scor total':'Total score','psychic-label':t.psychic,'somatic-label':t.somatic,'score-label':lang==='ro'?'Media (scor total ÷ 14)':'Mean (total score ÷ 14)','conclusion-label':lang==='ro'?'Concluzie':'Conclusion','result-note':lang==='ro'?'Concluzia folosește media rotunjită la cea mai apropiată cotă 0–4. Rezultat orientativ, nu diagnostic.':'The conclusion uses the mean rounded to the nearest 0–4 rating anchor. Indicative result, not a diagnosis.','share':t.share,'share-note':lang==='ro'?'Deschide WhatsApp cu mesajul precompletat; trimiterea o confirmi tu.':'Opens WhatsApp with a prefilled message; you confirm before sending.','edit':t.edit,'restart':t.restart,'footer':t.footer}))$(id).textContent=value;}
function showItem(){const t=T[lang];$('counter').textContent=`${t.question} ${idx+1} / 14`;$('progress-text').textContent=`${answers.filter(x=>x!==null).length} ${t.progress}`;$('progress').setAttribute('aria-valuenow',answers.filter(x=>x!==null).length);$('bar').style.width=`${(answers.filter(x=>x!==null).length/14)*100}%`;$('item-text').textContent=`${String(idx+1).padStart(2,'0')}. ${items[idx][lang==='ro'?0:1]}`;$('answers').replaceChildren();t.opts.forEach((label,n)=>{const b=document.createElement('button');b.className='answer'+(answers[idx]===n?' selected':'');b.setAttribute('aria-pressed',answers[idx]===n);b.setAttribute('aria-label',`${n}: ${label}${answers[idx]===n?' — '+t.selected:''}`);b.innerHTML=`<span class="num">${n}</span>${label}`;b.onclick=()=>choose(n);$('answers').append(b)});$('back').disabled=idx===0;$('back').style.opacity=idx===0?'.55':'1';}
function choose(n){answers[idx]=n;if(idx<13){idx++;showItem();$('item-text').focus()}else if(answers.every(x=>x!==null)){showResult()}}
function showResult(){const t=T[lang],sum=answers.reduce((a,b)=>a+b,0),mean=sum/14,psychic=[0,1,2,3,4,5,13].reduce((a,i)=>a+answers[i],0),somatic=answers.slice(6,13).reduce((a,b)=>a+b,0),rounded=Math.round(mean),category=lang==='ro'?['absentă','ușoară','moderată','severă','foarte severă / gravă'][rounded]:['absent','mild','moderate','severe','very severe / grave'][rounded];$('quiz').classList.add('hidden');$('result').classList.remove('hidden');$('total').textContent=sum;$('psychic').textContent=psychic;$('somatic').textContent=somatic;$('score').textContent=mean.toFixed(2);$('conclusion').textContent=lang==='ro'?`Anxietate ${category}`:`${category[0].toUpperCase()+category.slice(1)} anxiety`;const message=lang==='ro'?`Scala Hamilton — sumar orientativ\nScor total: ${sum}/56\nAnxietate psihică (itemii 1–6 și 14): ${psychic}/28\nAnxietate somatică (itemii 7–13): ${somatic}/28\nMedia (scor total ÷ 14): ${mean.toFixed(2)}/4\nConcluzie: anxietate ${category}\nRezultatul nu este diagnostic.`:`Hamilton scale — indicative summary\nTotal score: ${sum}/56\nPsychic anxiety (items 1–6 and 14): ${psychic}/28\nSomatic anxiety (items 7–13): ${somatic}/28\nMean (total score ÷ 14): ${mean.toFixed(2)}/4\nConclusion: ${category} anxiety\nThis is not a diagnosis.`;$('share').href='https://wa.me/40749255366?text='+encodeURIComponent(message);$('result').focus()}
$('language').onchange=e=>{lang=e.target.value;renderText();if(!$('quiz').classList.contains('hidden'))showItem();if(!$('result').classList.contains('hidden'))showResult()};$('start').onclick=()=>{$('intro').classList.add('hidden');$('result').classList.add('hidden');$('quiz').classList.remove('hidden');idx=0;showItem();$('item-text').focus()};$('back').onclick=()=>{if(idx>0){idx--;showItem();$('item-text').focus()}};$('edit').onclick=()=>{idx=13;$('result').classList.add('hidden');$('quiz').classList.remove('hidden');showItem();$('item-text').focus()};$('restart').onclick=()=>{answers=Array(14).fill(null);idx=0;$('result').classList.add('hidden');$('intro').classList.remove('hidden');window.scrollTo(0,0)};renderText();
</script></body></html>
